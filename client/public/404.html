<html lang="en">

    <meta http-equiv="refresh" content="0; url=/toofan-hackathon-build/" />
    <title>Opening Hackfinity</title>
    <script>
      (function () {
        var appBase = "/toofan-hackathon-build/";
        var destination = new URL(appBase, window.location.origin);
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        window.location.replace(destination.toString());
      })();
    </script>
